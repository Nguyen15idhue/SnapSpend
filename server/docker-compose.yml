services:
  postgres:
    image: postgres:17-alpine
    container_name: snapspend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: snapspend
      POSTGRES_USER: snapspend
      POSTGRES_PASSWORD: snapspend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapspend -d snapspend"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/SnapSpend.Api
    container_name: snapspend-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=snapspend;Username=snapspend;Password=snapspend
      Jwt__Key: ${JWT_KEY:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS}
      Jwt__Issuer: SnapSpend
      Jwt__Audience: SnapSpend.App
      Jwt__ExpiresMinutes: 10080
      Ai__ApiKey: ${GEMINI_API_KEY:-}
      Ai__Model: ${AI_MODEL:-gemini-3.8-flash}
      Ai__BaseUrl: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      Storage__BaseUrl: ${STORAGE_BASE_URL:-http://localhost:5080/uploads}
    ports:
      - "5080:5080"
    volumes:
      - ./src/SnapSpend.Api/wwwroot/uploads:/app/wwwroot/uploads

volumes:
  postgres_data:
